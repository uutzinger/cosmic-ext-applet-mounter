name: Promote verified release artifacts

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Build Debian packages run for this exact tag commit"
        required: true
        type: string
      flatpak_x86_64_run_id:
        description: "Optional accepted x86_64 Flatpak run at the exact tag commit"
        required: false
        type: string
      flatpak_aarch64_run_id:
        description: "Optional accepted aarch64 Flatpak run at the exact tag commit"
        required: false
        type: string
      accepted:
        description: "Advertised package modes and selected artifacts accepted; publication approved"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require approved stable-tag promotion
        env:
          SOURCE_REF: ${{ github.ref }}
          ACCEPTED: ${{ inputs.accepted }}
        run: '[[ "$SOURCE_REF" == refs/tags/v* && "$ACCEPTED" == true ]] || { echo "Accepted stable-tag publication required" >&2; exit 1; }'
      - name: Check out accepted tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          fetch-depth: 0
      - name: Install offline Flatpak inspection tools
        if: inputs.flatpak_x86_64_run_id != '' || inputs.flatpak_aarch64_run_id != ''
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes flatpak ostree
      - name: Verify and promote existing artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          FLATPAK_X86_RUN: ${{ inputs.flatpak_x86_64_run_id }}
          FLATPAK_ARM_RUN: ${{ inputs.flatpak_aarch64_run_id }}
        run: |
          arguments=("$RELEASE_TAG" "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --publish --accepted)
          if [[ -n "$FLATPAK_X86_RUN" ]]; then arguments+=(--flatpak-run "x86_64=$FLATPAK_X86_RUN"); fi
          if [[ -n "$FLATPAK_ARM_RUN" ]]; then arguments+=(--flatpak-run "aarch64=$FLATPAK_ARM_RUN"); fi
          python3 scripts/promote_release.py "${arguments[@]}"
      - name: Retain promotion summaries and checksum receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: promotion-receipts-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/task-runs/release-promotion-*/summary.json
            target/task-runs/release-promotion-*/artifacts.json
